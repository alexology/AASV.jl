name: Julia tests
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        julia-version: ['1.10', '1']
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: aasv_julia
    steps:
      - uses: actions/checkout@v4
        with:
          path: aasv_julia
      - name: Checkout alignment package
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/ProfileAlignments.jl
          path: ProfileAlignments.jl
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}
      - uses: julia-actions/cache@v2
      - name: Develop local alignment package
        run: julia --project=. setup.jl
      - name: Test independent alignment package
        run: julia --project=../ProfileAlignments.jl -e 'using Pkg; Pkg.test()'
      - name: Test AASV
        run: julia --project=. -e 'using Pkg; Pkg.test()'
